name: Bug report
description: Something isn't working as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.2.0 or abc1234
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser or Python/Node version, and where it's running.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
